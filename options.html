<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Animals Settings</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="opts">
<h1>ASCII Animals</h1>
<form id="f">
  <label>Animal
    <select id="animal"></select> <!-- options.js adds the seven animals -->
  </label>
  <label>Name (for the greeting)
    <input id="name" type="text" maxlength="40" autocomplete="off">
  </label>
  <!-- options.js builds the animal's own groups (Movement, its own, Look) here, and the same Background and Chat glass groups below it -->
  <div id="display"></div>
  <div id="tweaks"></div>
  <div id="extras"></div>
</form>
<div class="btns">
  <button id="reset" type="button">Reset</button>
  <button id="copy" type="button">Copy</button>
</div>
<button id="clear-history" type="button">Clear search history</button>
<div id="status" role="status"></div>
<script src="engine.js"></script>
<script src="options.js"></script>
</body>
</html>
